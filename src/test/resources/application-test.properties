spring.datasource.url=jdbc:h2:mem:banking_system;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

security.jwt.secret=test-only-signing-key-must-be-at-least-32-bytes-long-for-hs256
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=30d
security.refresh-cookie.name=refresh_token
security.refresh-cookie.secure=false
security.refresh-cookie.same-site=Strict
features.demo-funding.enabled=true
