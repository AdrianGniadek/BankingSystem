<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Rejestracja | BankingSystem</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page" data-page="register">
<main class="auth-layout">
    <section class="auth-brand" aria-labelledby="brand-title">
        <a class="brand brand--light" href="/" aria-label="BankingSystem">
            <span class="brand-mark">BS</span>
            <span>BankingSystem</span>
        </a>
        <div class="auth-brand__content">
            <p class="eyebrow">Nowy klient</p>
            <h1 id="brand-title">Zacznij zarządzać finansami po swojemu.</h1>
            <div class="security-note">
                <i data-lucide="badge-check" aria-hidden="true"></i>
                <span>Prosty dostęp do kont, przelewów i historii</span>
            </div>
        </div>
        <p class="auth-brand__footer">Projekt demonstracyjny BankingSystem</p>
    </section>

    <section class="auth-panel auth-panel--wide">
        <div class="auth-card auth-card--wide">
            <div class="auth-heading">
                <p class="eyebrow">Rejestracja</p>
                <h2>Utwórz konto</h2>
                <p>Wszystkie pola są wymagane.</p>
            </div>

            <div id="auth-alert" class="alert" role="alert" hidden></div>

            <form id="register-form" class="form-grid" novalidate>
                <div class="field">
                    <label for="register-first-name">Imię</label>
                    <input id="register-first-name" name="firstName" type="text"
                           autocomplete="given-name" minlength="2" maxlength="25" required>
                    <span class="field-error" data-error-for="firstName"></span>
                </div>

                <div class="field">
                    <label for="register-last-name">Nazwisko</label>
                    <input id="register-last-name" name="lastName" type="text"
                           autocomplete="family-name" minlength="2" maxlength="25" required>
                    <span class="field-error" data-error-for="lastName"></span>
                </div>

                <div class="field field--full">
                    <label for="register-email">Adres e-mail</label>
                    <input id="register-email" name="email" type="email"
                           autocomplete="email" placeholder="jan@example.com" required>
                    <span class="field-error" data-error-for="email"></span>
                </div>

                <div class="field">
                    <label for="register-pesel">PESEL</label>
                    <input id="register-pesel" name="pesel" type="text" inputmode="numeric"
                           autocomplete="off" pattern="[0-9]{11}" maxlength="11"
                           placeholder="11 cyfr" required>
                    <span class="field-error" data-error-for="pesel"></span>
                </div>

                <div class="field">
                    <label for="register-phone">Numer telefonu</label>
                    <input id="register-phone" name="phoneNumber" type="tel" inputmode="tel"
                           autocomplete="tel" pattern="[0-9]{9}" maxlength="9"
                           placeholder="9 cyfr" required>
                    <span class="field-error" data-error-for="phoneNumber"></span>
                </div>

                <div class="field field--full">
                    <label for="register-password">Hasło</label>
                    <div class="input-with-icon input-with-icon--plain">
                        <input id="register-password" name="password" type="password"
                               autocomplete="new-password" minlength="8" maxlength="72"
                               placeholder="Od 8 do 72 znaków" required>
                        <button class="icon-button input-action" type="button"
                                data-password-toggle="register-password" aria-label="Pokaż hasło"
                                title="Pokaż hasło">
                            <i data-lucide="eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span class="field-error" data-error-for="password"></span>
                </div>

                <button class="button button--primary button--wide field--full" type="submit">
                    <span>Utwórz konto</span>
                    <i data-lucide="arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <p class="auth-switch">Masz już konto?
                <a href="/login.html">Zaloguj się</a>
            </p>
        </div>
    </section>
</main>

<div id="toast-region" class="toast-region" aria-live="polite"></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"
        integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu"
        crossorigin="anonymous"></script>
<script src="/script.js"></script>
</body>
</html>
