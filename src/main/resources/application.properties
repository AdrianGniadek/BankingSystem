spring.application.name=banking-system
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

spring.web.locale=pl_PL
spring.web.locale-resolver=fixed

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:30d}
security.refresh-cookie.name=refresh_token
security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
security.refresh-cookie.same-site=Strict

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

features.demo-funding.enabled=false
